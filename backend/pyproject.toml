[project]
name = "maintainiq"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["Django>=5.2,<5.3", "djangorestframework>=3.16,<4", "psycopg[binary]>=3,<4", "celery>=5.5,<6", "redis>=6,<8", "django-cors-headers>=4,<5", "drf-spectacular>=0.28,<1", "django-storages[s3]>=1.14,<2", "argon2-cffi>=25,<26", "gunicorn>=23,<26"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-django>=4.11,<5", "pytest-cov>=6,<8", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
