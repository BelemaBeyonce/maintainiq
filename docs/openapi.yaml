components:
  schemas:
    AcceptInputRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 40
          maxLength: 100
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 12
          maxLength: 128
      required:
      - full_name
      - password
      - token
    Asset:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        site_id:
          type: string
          format: uuid
        site_name:
          type: string
          readOnly: true
        category_id:
          type: string
          format: uuid
        category_name:
          type: string
          readOnly: true
        functional_location_id:
          type: string
          format: uuid
          nullable: true
        location_code:
          type: string
          readOnly: true
          default: ''
        parent_id:
          type: string
          format: uuid
          nullable: true
        tag:
          type: string
          maxLength: 60
        name:
          type: string
          maxLength: 160
        manufacturer:
          type: string
          maxLength: 100
        model:
          type: string
          maxLength: 100
        serial_number:
          type: string
          maxLength: 120
        status:
          $ref: '#/components/schemas/StatusEnum'
        criticality:
          $ref: '#/components/schemas/CriticalityEnum'
        description:
          type: string
          maxLength: 5000
        is_synthetic:
          type: boolean
          readOnly: true
        archived_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - archived_at
      - category_id
      - category_name
      - created_at
      - id
      - is_synthetic
      - location_code
      - name
      - site_id
      - site_name
      - tag
      - updated_at
    AssetRequest:
      type: object
      properties:
        site_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        functional_location_id:
          type: string
          format: uuid
          nullable: true
        parent_id:
          type: string
          format: uuid
          nullable: true
        tag:
          type: string
          minLength: 1
          maxLength: 60
        name:
          type: string
          minLength: 1
          maxLength: 160
        manufacturer:
          type: string
          maxLength: 100
        model:
          type: string
          maxLength: 100
        serial_number:
          type: string
          maxLength: 120
        status:
          $ref: '#/components/schemas/StatusEnum'
        criticality:
          $ref: '#/components/schemas/CriticalityEnum'
        description:
          type: string
          maxLength: 5000
      required:
      - category_id
      - name
      - site_id
      - tag
    Audit:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        site_id:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        actor_name:
          type: string
          default: System
        action:
          type: string
          maxLength: 40
        entity_type:
          type: string
          maxLength: 40
        object_id:
          type: string
          format: uuid
        before: {}
        after: {}
        timestamp:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - entity_type
      - id
      - object_id
      - site_id
      - timestamp
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 100
      required:
      - code
      - id
      - name
    CategoryRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - code
      - name
    CriticalityEnum:
      enum:
      - low
      - medium
      - high
      - critical
      type: string
      description: |-
        * `low` - Low
        * `medium` - Medium
        * `high` - High
        * `critical` - Critical
    InviteInputRequest:
